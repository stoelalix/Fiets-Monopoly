<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fietsmonopoly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C8102E'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3Eƒ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root {
  --board: #CFE6D1;
  --board-dark: #9CC7A0;
  --ink: #111;
  --paper: #FFFDF6;
  --red: #C8102E;
  --strava: #FC4C02;
  --muted: #5d6b60;
  --radius: 6px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  color: var(--ink);
  background: var(--board);
  display: flex; flex-direction: column;
}
button { font: inherit; cursor: pointer; }
.small { font-size: 13px; color: var(--muted); }
.err { color: var(--red); font-weight: 600; min-height: 1em; }

/* ---------- topbar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; background: var(--paper); border-bottom: 3px solid var(--ink);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand span {
  font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 2px;
  background: var(--red); color: #fff; padding: 2px 14px 0; border: 2px solid var(--ink);
  transform: rotate(-2deg); display: inline-block;
}
.wheel { width: 30px; height: 30px; color: var(--ink); animation: spin 12s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.me { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.me a { color: var(--muted); font-weight: 400; font-size: 14px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); display: inline-block; flex: none; }

/* ---------- layout ---------- */
.app { flex: 1; display: flex; min-height: 0; }
.mapwrap { position: relative; flex: 1; min-width: 0; border-right: 3px solid var(--ink); }
#map { position: absolute; inset: 0; background: #e8efe4; }
.leaflet-tile-pane { filter: sepia(.18) saturate(.85) brightness(1.02); }
.side { width: 420px; display: flex; flex-direction: column; background: var(--board); min-height: 0; }
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .mapwrap { flex: none; height: 55vh; border-right: 0; border-bottom: 3px solid var(--ink); }
  .side { width: auto; flex: 1; }
}

.mapctl {
  position: absolute; top: 10px; right: 10px; z-index: 500;
  background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); padding: 6px 10px;
}
.chk { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; }
.legend {
  position: absolute; left: 10px; bottom: 22px; z-index: 500;
  background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); padding: 6px 10px;
  font-size: 13px; display: flex; flex-direction: column; gap: 3px;
}
.legend div { display: flex; align-items: center; gap: 6px; }

/* ---------- buttons ---------- */
.actions { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; }
.btn {
  border: 2px solid var(--ink); border-radius: var(--radius); padding: 9px 14px; font-weight: 700;
  background: var(--paper); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn-strava { background: var(--strava); color: #fff; }
.btn-ghost { background: var(--paper); cursor: pointer; }
.btn.big { font-size: 18px; padding: 12px 20px; }
.btn-danger { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 2px 2px 0 var(--red); padding: 4px 8px; font-size: 13px; }

/* ---------- players ---------- */
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; padding: 0 12px 12px; }
.pcard {
  background: var(--paper); border: 2px solid var(--ink); border-radius: var(--radius); padding: 8px 10px;
  border-left-width: 8px;
}
.pcard .nm { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.pcard .bal { font-family: 'Bebas Neue', sans-serif; font-size: 28px; line-height: 1; margin-top: 4px; }
.pcard .bal.neg { color: var(--red); }
.pcard .sub { font-size: 13px; color: var(--muted); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 3px solid var(--ink); }
.tab {
  border: 2px solid var(--ink); border-bottom: 0; background: var(--board-dark); padding: 6px 10px;
  border-radius: var(--radius) var(--radius) 0 0; font-weight: 600; font-size: 14px;
}
.tab.active { background: var(--paper); }
.panel { flex: 1; overflow-y: auto; padding: 12px; background: var(--paper); }
.panel h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin: 14px 0 6px; }
.panel h3:first-child { margin-top: 0; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }

/* ---------- eigendomsbewijs ---------- */
.deeds { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.deed {
  background: #fff; border: 2px solid var(--ink); border-radius: 3px; padding: 6px; cursor: pointer;
  box-shadow: 2px 2px 0 rgba(0,0,0,.25); font-size: 13px; text-align: center;
  transition: transform .15s;
}
.deed:hover { transform: translateY(-2px) rotate(-.5deg); }
.deed .band { border: 2px solid var(--ink); padding: 4px 4px 6px; color: #fff; margin-bottom: 6px; }
.deed .band.light { color: var(--ink); }
.deed .kind { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .9; }
.deed .title { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: .5px; line-height: 1.05; word-break: break-word; }
.deed table { width: 100%; border-collapse: collapse; }
.deed td { padding: 1px 2px; }
.deed td:last-child { text-align: right; font-weight: 600; }
.deed tr.cur td { background: #FFF2B3; }
.deed .foot { border-top: 1px solid #ccc; margin-top: 4px; padding-top: 4px; color: var(--muted); }
.houses { display: inline-flex; gap: 2px; vertical-align: middle; }
.houses i { width: 10px; height: 10px; background: #1FB25A; border: 1px solid var(--ink); display: inline-block; clip-path: polygon(50% 0, 100% 40%, 100% 100%, 0 100%, 0 40%); }
.houses i.hotel { background: var(--red); width: 16px; }

/* ---------- feed ---------- */
.ev { border: 2px solid var(--ink); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; background: #fff; }
.ev .hd { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.ev .when { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
.ev ul { margin: 6px 0 0; padding-left: 18px; }
.ev li { margin: 2px 0; }
.ev .tools { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.plus { color: #138a43; font-weight: 700; }
.min { color: var(--red); font-weight: 700; }
.linkbtn { background: none; border: 0; color: #1d5fbf; text-decoration: underline; padding: 0; font-size: 14px; }

/* ---------- login ---------- */
.login { flex: 1; display: grid; place-items: center; padding: 20px; }
.chance {
  background: #F7A21B; border: 3px solid var(--ink); border-radius: 10px; padding: 28px 30px; max-width: 440px; text-align: center;
  box-shadow: 8px 8px 0 var(--ink); position: relative; transform: rotate(-1.5deg);
}
.chance h1 { font-family: 'Bebas Neue', sans-serif; font-size: 54px; margin: 0 0 6px; letter-spacing: 3px; }
.chance-q { position: absolute; top: -26px; right: -18px; width: 64px; height: 64px; border-radius: 50%; background: var(--red); color: #fff; border: 3px solid var(--ink); font-family: 'Bebas Neue'; font-size: 48px; line-height: 64px; }
.chance p { font-size: 17px; }
.chance .small { color: #3b2a07; }

/* ---------- busy / modal / toast ---------- */
.busy, .modal { position: fixed; inset: 0; background: rgba(20, 40, 25, .55); z-index: 2000; display: grid; place-items: center; padding: 16px; }
.busy[hidden], .modal[hidden], .toast[hidden], .app[hidden], .login[hidden] { display: none; }
.busy-card { background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; padding: 22px 26px; text-align: center; min-width: 280px; box-shadow: 6px 6px 0 var(--ink); font-weight: 700; }
.dice { width: 46px; height: 46px; margin: 0 auto 12px; background: #fff; border: 3px solid var(--ink); border-radius: 9px; position: relative; animation: roll 1s ease-in-out infinite; }
.dice span { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.dice span:nth-child(1) { top: 6px; left: 6px; } .dice span:nth-child(2) { top: 6px; right: 6px; }
.dice span:nth-child(3) { top: 16px; left: 16px; } .dice span:nth-child(4) { bottom: 6px; left: 6px; } .dice span:nth-child(5) { bottom: 6px; right: 6px; }
@keyframes roll { 0% { transform: rotate(0); } 50% { transform: rotate(180deg) scale(.9); } 100% { transform: rotate(360deg); } }

.modal-card { background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; max-width: 760px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px 22px; position: relative; box-shadow: 8px 8px 0 var(--ink); }
.modal-x { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 28px; line-height: 1; }
.report h2 { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; font-weight: 700; background: #fff; }
.chip.go { background: #E9F7EE; } .chip.bad { background: #FDECEC; }
.deeds.reveal .deed { animation: flipin .6s backwards; }
@keyframes flipin { from { transform: rotateY(90deg) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--radius); z-index: 3000; font-weight: 600; max-width: 90vw; }

/* ---------- kaart ---------- */
.house-marker { display: flex; gap: 1px; filter: drop-shadow(1px 1px 0 rgba(0,0,0,.4)); }
.house-marker i { width: 11px; height: 11px; background: #1FB25A; border: 1.5px solid var(--ink); clip-path: polygon(50% 0, 100% 40%, 100% 100%, 0 100%, 0 40%); display: block; }
.house-marker i.hotel { background: var(--red); width: 18px; height: 13px; }
.leaflet-popup-content-wrapper { border-radius: 4px; border: 2px solid var(--ink); }
.leaflet-popup-content { margin: 8px; }
.leaflet-popup-content .deed { box-shadow: none; border: 0; cursor: default; width: 190px; }
.rules p, .rules li { font-size: 15px; line-height: 1.45; }
@media (max-width: 860px) {
  .legend { font-size: 11px; padding: 4px 8px; bottom: 18px; }
  .legend .small { display: none; }
  .me { font-size: 14px; }
}

.btn-red { background: var(--red); color: #fff; cursor: pointer; }
.actions { align-items: center; }
.form { display: flex; gap: 8px; margin: 10px 0; }
.form input, .sharebox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: var(--radius); background: #fff; }
.or { margin: 14px 0 4px; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
.chance .linkbtn { cursor: pointer; }
.colors { display: flex; gap: 10px; justify-content: center; }
.cpick input { display: none; }
.cpick span { display: block; width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer; }
.cpick input:checked + span { outline: 4px solid #fff; box-shadow: 0 0 0 7px var(--ink); }
.sharebox { display: flex; gap: 8px; margin: 10px 0; }
.sidefoot { padding: 8px 12px; background: var(--paper); border-top: 1px solid #ccc; font-size: 14px; }
.sidefoot .linkbtn { cursor: pointer; }
#welcome, #join { min-height: calc(100vh - 60px); }

</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module">
// Fietsmonopoly – spelmotor
// 1) Rit (lijst [lat, lon]) koppelen aan wegen uit OpenStreetMap (via Overpass)
// 2) Alle ritten van alle spelers op volgorde "naspelen" volgens de spelregels
// Dit bestand draait in de browser én in Node (voor tests).

const START_MONEY = 1500;
const START_BONUS = 200;
const LOOP_RADIUS_M = 500;

const KINDS = {
  straat:   { label: 'Straat',   color: '#0072BB', base: 60,  perM: 0.08, cap: 350 },
  fietspad: { label: 'Fietspad', color: '#1FB25A', base: 80,  perM: 0.10, cap: 400 },
  pad:      { label: 'Pad',      color: '#8B5A2B', base: 60,  perM: 0.06, cap: 300 },
  brug:     { label: 'Brug',     color: '#F28C00', base: 180, perM: 0,    cap: 180 },
  tunnel:   { label: 'Tunnel',   color: '#5E5E5E', base: 160, perM: 0,    cap: 160 },
  rotonde:  { label: 'Rotonde',  color: '#D93A96', base: 120, perM: 0,    cap: 120 },
  pont:     { label: 'Pont',     color: '#111111', base: 200, perM: 0,    cap: 200 },
};
const RENT_MULT = [1, 5, 15, 45, 80, 125]; // kaal, 1-4 huizen, hotel
const PONT_RENT = [0, 25, 50, 100, 200];

const round10 = (x) => Math.round(x / 10) * 10;

// ---------- geometrie ----------
const R = 6371000;
const rad = (d) => (d * Math.PI) / 180;

function haversine(a, b) {
  const dLat = rad(b[0] - a[0]), dLon = rad(b[1] - a[1]);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function trackLength(latlngs) {
  let d = 0;
  for (let i = 1; i < latlngs.length; i++) d += haversine(latlngs[i - 1], latlngs[i]);
  return d;
}

function projector(lat0) {
  const k = Math.cos(rad(lat0));
  return (lat, lon) => [rad(lon) * R * k, rad(lat) * R];
}

// Douglas-Peucker op geprojecteerde punten; geeft indexen terug
function simplifyIdx(pts, tol) {
  const n = pts.length;
  if (n <= 2) return pts.map((_, i) => i);
  const keep = new Uint8Array(n);
  keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let maxD = 0, idx = -1;
    for (let i = a + 1; i < b; i++) {
      const d = segDist(pts[i], pts[a], pts[b]).d;
      if (d > maxD) { maxD = d; idx = i; }
    }
    if (maxD > tol && idx > 0) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
  }
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(i);
  return out;
}

function simplifyLatLngs(latlngs, tolM) {
  if (latlngs.length <= 2) return latlngs.slice();
  const P = projector(latlngs[0][0]);
  const pts = latlngs.map(([a, b]) => P(a, b));
  return simplifyIdx(pts, tolM).map((i) => latlngs[i]);
}

// afstand punt p tot segment a-b, plus positie t (0..1) langs het segment
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L2 = dx * dx + dy * dy;
  let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
  t = Math.max(0, Math.min(1, t));
  const x = a[0] + t * dx, y = a[1] + t * dy;
  return { d: Math.hypot(p[0] - x, p[1] - y), t };
}

const r5 = (x) => Math.round(x * 1e5) / 1e5;

// ---------- Overpass ----------
const HW_QUERY = 'trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|service|road|cycleway|path|track|pedestrian|footway|bridleway';

function buildOverpassQueries(latlngs, { chunk = 220, radius = 30 } = {}) {
  const simple = simplifyLatLngs(latlngs, 15);
  const queries = [];
  for (let i = 0; i < simple.length - 1; i += chunk - 1) {
    const part = simple.slice(i, i + chunk);
    if (part.length < 2) break;
    const line = part.map(([a, b]) => `${a.toFixed(5)},${b.toFixed(5)}`).join(',');
    queries.push(
      `[out:json][timeout:120];(` +
      `way["highway"~"^(${HW_QUERY})$"](around:${radius},${line});` +
      `way["route"="ferry"](around:60,${line});` +
      `);out body geom;`
    );
  }
  return queries;
}

const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
];

async function fetchOverpass(queries, onProgress = () => {}) {
  const byId = new Map();
  for (let qi = 0; qi < queries.length; qi++) {
    onProgress(qi, queries.length);
    let ok = false, lastErr;
    for (let attempt = 0; attempt < OVERPASS_ENDPOINTS.length * 2 && !ok; attempt++) {
      const url = OVERPASS_ENDPOINTS[attempt % OVERPASS_ENDPOINTS.length];
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(queries[qi]),
        });
        if (!res.ok) throw new Error('Overpass ' + res.status);
        const data = await res.json();
        for (const el of data.elements || []) byId.set(el.id, el);
        ok = true;
      } catch (e) {
        lastErr = e;
        await new Promise((r) => setTimeout(r, 1500 * (attempt + 1)));
      }
    }
    if (!ok) throw lastErr || new Error('Kaartgegevens ophalen mislukt');
  }
  return [...byId.values()];
}

// ---------- wegen indelen ----------
const yes = (v) => v && v !== 'no';
const bikeOk = (t) => ['yes', 'designated', 'permissive'].includes(t.bicycle);

function usable(t) {
  if (t.route === 'ferry') return true;
  const h = t.highway;
  if (!h || t.area === 'yes') return false;
  if (t.bicycle === 'no' || t.bicycle === 'dismount' && !yes(t.bridge)) return false;
  if (['footway', 'pedestrian', 'bridleway'].includes(h)) return bikeOk(t);
  if (['trunk', 'trunk_link'].includes(h)) return bikeOk(t);
  if (h === 'service' && ['parking_aisle', 'driveway', 'drive-through'].includes(t.service)) return false;
  return true;
}

function classify(t) {
  if (t.route === 'ferry') return 'pont';
  if (t.junction === 'roundabout' || t.junction === 'circular') return 'rotonde';
  if (yes(t.bridge)) return 'brug';
  if (yes(t.tunnel) && t.tunnel !== 'building_passage') return 'tunnel';
  if (t.highway === 'cycleway' || (t.highway === 'path' && bikeOk(t))) return 'fietspad';
  if (t.highway === 'path' || t.highway === 'track') return 'pad';
  return 'straat';
}

// ---------- rit koppelen aan wegen ----------
function matchRide(latlngs, elements, opts = {}) {
  const maxDist = opts.maxDist ?? 22;
  if (!latlngs || latlngs.length < 2) return { ways: [], track: [], loop: false, distanceKm: 0 };
  const P = projector(latlngs[0][0]);

  // alle bruikbare wegen voorbereiden
  const ways = [];
  const nodeWays = new Map();
  for (const el of elements) {
    if (el.type !== 'way' || !el.geometry || el.geometry.length < 2) continue;
    const t = el.tags || {};
    const isHw = !!t.highway;
    const pts = el.geometry.map((g) => P(g.lat, g.lon));
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const w = { el, t, pts, cum, len: cum[cum.length - 1], k: usable(t) ? classify(t) : null, isHw };
    ways.push(w);
    for (const n of el.nodes || []) {
      if (!nodeWays.has(n)) nodeWays.set(n, []);
      nodeWays.get(n).push(w);
    }
  }

  // ruimtelijke index (vakjes van 40 m)
  const CELL = 40;
  const grid = new Map();
  const cellKey = (x, y) => `${Math.floor(x / CELL)},${Math.floor(y / CELL)}`;
  ways.forEach((w, wi) => {
    for (let si = 0; si < w.pts.length - 1; si++) {
      const a = w.pts[si], b = w.pts[si + 1];
      const x0 = Math.floor(Math.min(a[0], b[0]) / CELL), x1 = Math.floor(Math.max(a[0], b[0]) / CELL);
      const y0 = Math.floor(Math.min(a[1], b[1]) / CELL), y1 = Math.floor(Math.max(a[1], b[1]) / CELL);
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
        const k = `${x},${y}`;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push([wi, si]);
      }
    }
  });
  const nearby = (p) => {
    const cx = Math.floor(p[0] / CELL), cy = Math.floor(p[1] / CELL);
    const out = [];
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const c = grid.get(`${cx + dx},${cy + dy}`);
      if (c) out.push(...c);
    }
    return out;
  };

  // track herbemonsteren op max 8 m tussen punten
  const raw = latlngs.map(([a, b]) => P(a, b));
  const tr = [raw[0]];
  for (let i = 1; i < raw.length; i++) {
    const a = raw[i - 1], b = raw[i];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const steps = Math.min(200, Math.ceil(d / 8));
    for (let s = 1; s <= steps; s++) tr.push([a[0] + ((b[0] - a[0]) * s) / steps, a[1] + ((b[1] - a[1]) * s) / steps]);
  }

  // elk punt toewijzen aan de dichtstbijzijnde weg (fietspaden krijgen voorrang)
  const hits = new Map();
  for (const p of tr) {
    let best = null, bestEff = Infinity;
    for (const [wi, si] of nearby(p)) {
      const w = ways[wi];
      if (!w.k) continue;
      const { d, t } = segDist(p, w.pts[si], w.pts[si + 1]);
      const lim = w.k === 'pont' ? 45 : maxDist;
      if (d > lim) continue;
      const eff = d - (w.k === 'fietspad' ? 4 : 0) - (w.k === 'brug' || w.k === 'tunnel' ? 2 : 0);
      if (eff < bestEff) {
        bestEff = eff;
        const segLen = w.cum[si + 1] - w.cum[si];
        best = { wi, along: w.cum[si] + t * segLen };
      }
    }
    if (!best) continue;
    let h = hits.get(best.wi);
    if (!h) hits.set(best.wi, (h = { min: Infinity, max: -Infinity, count: 0 }));
    h.min = Math.min(h.min, best.along);
    h.max = Math.max(h.max, best.along);
    h.count++;
  }

  // naam van een weg in de buurt (voor naamloze fietspaden e.d.)
  const nearName = (w) => {
    const mid = w.pts[Math.floor(w.pts.length / 2)];
    let best = null, bd = 35;
    for (const [wi, si] of nearby(mid)) {
      const o = ways[wi];
      if (o === w || !o.t.name || !o.isHw || ['cycleway', 'path', 'footway', 'track'].includes(o.t.highway)) continue;
      const { d } = segDist(mid, o.pts[si], o.pts[si + 1]);
      if (d < bd) { bd = d; best = o.t.name; }
    }
    return best;
  };
  const connectedNames = (w) => {
    const names = new Set();
    for (const n of w.el.nodes || []) for (const o of nodeWays.get(n) || []) {
      if (o !== w && o.t.name && o.k !== 'rotonde') names.add(o.t.name);
    }
    return [...names].sort().slice(0, 2);
  };

  const out = [];
  for (const [wi, h] of hits) {
    const w = ways[wi];
    const span = h.max - h.min;
    const ridden =
      span >= Math.min(60, 0.5 * w.len) ||
      (w.k === 'rotonde' && h.count >= 3) ||
      (w.len < 25 && h.count >= 3);
    if (!ridden) continue;
    const t = w.t;
    let n, named = false;
    switch (w.k) {
      case 'pont': n = t.name ? (t.name.toLowerCase().includes('pont') || t.name.toLowerCase().includes('veer') ? t.name : 'Pont ' + t.name) : 'Pont'; named = !!t.name; break;
      case 'rotonde': { const c = connectedNames(w); n = t.name || (c.length ? 'Rotonde ' + c.join(' / ') : 'Rotonde'); break; }
      case 'brug': { const near = t.name || nearName(w); n = t['bridge:name'] || (near ? 'Brug · ' + near : 'Brug'); break; }
      case 'tunnel': { const near = t.name || nearName(w); n = t['tunnel:name'] || (near ? 'Tunnel · ' + near : 'Tunnel'); break; }
      default:
        if (t.name) { n = t.name; named = true; }
        else {
          const near = nearName(w);
          const base = w.k === 'fietspad' ? 'Fietspad' : w.k === 'pad' ? (t.highway === 'track' ? 'Zandpad' : 'Pad') : (t.ref || 'Naamloze weg');
          n = near ? `${base} langs ${near}` : base;
        }
    }
    const nodes = w.el.nodes || [];
    const geomIdx = simplifyIdx(w.pts, 3);
    out.push({
      id: w.el.id,
      k: w.k,
      n,
      named,
      ends: nodes.length ? [nodes[0], nodes[nodes.length - 1]] : [],
      len: Math.round(w.len),
      g: geomIdx.map((i) => [r5(w.el.geometry[i].lat), r5(w.el.geometry[i].lon)]),
    });
  }

  const track = simplifyLatLngs(latlngs, 8).map(([a, b]) => [r5(a), r5(b)]);
  return {
    ways: out,
    track,
    loop: haversine(latlngs[0], latlngs[latlngs.length - 1]) < LOOP_RADIUS_M,
    distanceKm: Math.round(trackLength(latlngs) / 10) / 100,
  };
}

// ---------- GPX ----------
function parseGPX(text, fileName = 'GPX-rit') {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Dit lijkt geen geldig GPX-bestand');
  let pts = [...doc.getElementsByTagName('trkpt')];
  if (!pts.length) pts = [...doc.getElementsByTagName('rtept')];
  const latlngs = pts.map((p) => [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon'))]).filter(([a, b]) => isFinite(a) && isFinite(b));
  if (latlngs.length < 2) throw new Error('Geen route-punten gevonden in het GPX-bestand');
  const timeEl = pts[0] && pts[0].getElementsByTagName('time')[0];
  const date = timeEl ? new Date(timeEl.textContent).toISOString() : new Date().toISOString();
  const nameEl = doc.querySelector('trk > name') || doc.querySelector('metadata > name');
  const name = (nameEl && nameEl.textContent.trim()) || fileName.replace(/\.gpx$/i, '');
  return { latlngs, date, name };
}

// ---------- spelregels ----------
function priceOf(kind, len) {
  const K = KINDS[kind];
  return Math.min(K.cap, round10(K.base + K.perM * len));
}
const houseCostOf = (price) => Math.max(50, round10(price / 2));

function rentOf(prop, props) {
  if (prop.kind === 'pont') {
    let n = 0;
    for (const p of props.values()) if (p.kind === 'pont' && p.owner === prop.owner) n++;
    return PONT_RENT[Math.min(4, n)];
  }
  return Math.max(2, Math.round(prop.price / 10)) * RENT_MULT[prop.houses];
}

function rentTable(prop) {
  const base = Math.max(2, Math.round(prop.price / 10));
  return RENT_MULT.map((m) => base * m);
}

function bboxDist(a, b) {
  // ruwe afstand in meters tussen twee bounding boxes [minLat,minLon,maxLat,maxLon]
  const dLat = Math.max(0, a[0] - b[2], b[0] - a[2]);
  const dLon = Math.max(0, a[1] - b[3], b[1] - a[3]);
  return Math.hypot(dLat * 111320, dLon * 111320 * Math.cos(rad(a[0])));
}
function wayBBox(g) {
  let b = [Infinity, Infinity, -Infinity, -Infinity];
  for (const [la, lo] of g) b = [Math.min(b[0], la), Math.min(b[1], lo), Math.max(b[2], la), Math.max(b[3], lo)];
  return b;
}

// Speelt alle ritten na in volgorde van rijdatum en berekent de stand.
function replay(players, rides) {
  const P = new Map();
  for (const p of players) P.set(p.id, { ...p, balance: START_MONEY, km: 0, rides: 0 });

  const props = new Map();
  const wayToProp = new Map();
  const nodeIndex = new Map();
  const nameIndex = new Map();
  const reports = [];
  const startDays = new Set();
  let seq = 0;

  const addWay = (prop, w) => {
    prop.ways.set(w.id, w);
    prop.len += w.len;
    const b = wayBBox(w.g);
    prop.bbox = [Math.min(prop.bbox[0], b[0]), Math.min(prop.bbox[1], b[1]), Math.max(prop.bbox[2], b[2]), Math.max(prop.bbox[3], b[3])];
    wayToProp.set(w.id, prop.key);
    for (const e of w.ends || []) {
      if (!nodeIndex.has(e)) nodeIndex.set(e, new Set());
      nodeIndex.get(e).add(prop.key);
    }
  };

  const assign = (w) => {
    if (wayToProp.has(w.id)) return props.get(wayToProp.get(w.id));
    let prop = null;
    if (w.named) {
      const nk = w.k + '|' + w.n;
      const b = wayBBox(w.g);
      for (const key of nameIndex.get(nk) || []) {
        if (bboxDist(props.get(key).bbox, b) < 500) { prop = props.get(key); break; }
      }
    } else {
      for (const e of w.ends || []) {
        for (const key of nodeIndex.get(e) || []) {
          const c = props.get(key);
          if (c.kind !== w.k || c.named) continue;
          const sameName = c.name === w.n || ['rotonde', 'brug', 'tunnel'].includes(w.k);
          if (sameName) { prop = c; break; }
        }
        if (prop) break;
      }
      // naamloze stukken met dezelfde "langs …"-naam vlak bij elkaar (bv. onderbroken door een brug)
      if (!prop && / langs /.test(w.n)) {
        const b = wayBBox(w.g);
        for (const c of props.values()) {
          if (c.kind === w.k && c.name === w.n && bboxDist(c.bbox, b) < 150) { prop = c; break; }
        }
      }
    }
    if (!prop) {
      prop = {
        key: 'p' + w.id, name: w.n, kind: w.k, named: w.named,
        ways: new Map(), len: 0, bbox: [Infinity, Infinity, -Infinity, -Infinity],
        owner: null, price: null, houses: 0, boughtOn: null, firstSeen: seq,
        rentEarned: 0, timesRiddenByOthers: 0,
      };
      props.set(prop.key, prop);
      if (w.named) {
        const nk = w.k + '|' + w.n;
        if (!nameIndex.has(nk)) nameIndex.set(nk, []);
        nameIndex.get(nk).push(prop.key);
      }
    }
    addWay(prop, w);
    return prop;
  };

  const sorted = [...rides].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : String(a.rideId).localeCompare(String(b.rideId))));

  for (const r of sorted) {
    const pl = P.get(r.playerId);
    if (!pl) continue;
    seq++;
    const rk = r.playerId + ':' + r.rideId;
    const ev = [];
    const km = Math.round(r.distanceKm || 0);
    pl.balance += km; pl.km += r.distanceKm || 0; pl.rides++;
    ev.push({ t: 'km', amount: km });
    const day = String(r.date).slice(0, 10);
    if (r.loop && !startDays.has(pl.id + day)) {
      startDays.add(pl.id + day);
      pl.balance += START_BONUS;
      ev.push({ t: 'start', amount: START_BONUS });
    }

    const touched = new Map();
    for (const w of r.ways || []) {
      if (!KINDS[w.k]) continue;
      const pr = assign(w);
      touched.set(pr.key, pr);
    }

    // goedkoopste eerst kopen, dan kom je met je geld verder
    const order = [...touched.values()].sort((a, b) => priceOf(a.kind, a.len) - priceOf(b.kind, b.len));
    for (const pr of order) {
      if (!pr.owner) {
        const price = priceOf(pr.kind, pr.len);
        if (pl.balance >= price) {
          pl.balance -= price;
          pr.owner = pl.id; pr.price = price; pr.boughtOn = rk; pr.boughtDate = r.date;
          ev.push({ t: 'buy', key: pr.key, amount: price });
        } else {
          ev.push({ t: 'tooExpensive', key: pr.key, amount: price });
        }
      } else if (pr.owner === pl.id) {
        if (pr.boughtOn === rk || pr.kind === 'pont' || pr.houses >= 5) { if (pr.boughtOn !== rk) ev.push({ t: 'own', key: pr.key }); continue; }
        const cost = houseCostOf(pr.price);
        if (pl.balance >= cost) {
          pl.balance -= cost; pr.houses++;
          ev.push({ t: pr.houses === 5 ? 'hotel' : 'house', key: pr.key, amount: cost, houses: pr.houses });
        } else ev.push({ t: 'own', key: pr.key });
      } else {
        const owner = P.get(pr.owner);
        const rent = rentOf(pr, props);
        pl.balance -= rent;
        if (owner) owner.balance += rent;
        pr.rentEarned += rent; pr.timesRiddenByOthers++;
        ev.push({ t: 'rent', key: pr.key, amount: rent, to: pr.owner });
      }
    }

    reports.push({
      key: rk, playerId: r.playerId, rideId: r.rideId, name: r.name, date: r.date,
      distanceKm: r.distanceKm, source: r.source, loop: r.loop, events: ev,
    });
  }

  // vermogen
  for (const pl of P.values()) {
    pl.propCount = 0; pl.worth = pl.balance;
  }
  for (const pr of props.values()) {
    if (!pr.owner || !P.has(pr.owner)) continue;
    const pl = P.get(pr.owner);
    pl.propCount++;
    pl.worth += pr.price + pr.houses * houseCostOf(pr.price);
  }

  return { players: P, props, reports: reports.reverse() };
}

const fmtMoney = (n) => (n < 0 ? '−ƒ' : 'ƒ') + Math.abs(Math.round(n)).toLocaleString('nl-NL');

// ---------- compacte opslag van lijnen (Google polyline-codering) ----------
function encodePolyline(pts) {
  let out = '', pLat = 0, pLon = 0;
  const enc = (v) => {
    v = v < 0 ? ~(v << 1) : v << 1;
    let s = '';
    while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
    return s + String.fromCharCode(v + 63);
  };
  for (const [la, lo] of pts) {
    const a = Math.round(la * 1e5), b = Math.round(lo * 1e5);
    out += enc(a - pLat) + enc(b - pLon);
    pLat = a; pLon = b;
  }
  return out;
}
function decodePolyline(str) {
  const pts = [];
  let i = 0, lat = 0, lon = 0;
  const dec = () => {
    let r = 0, s = 0, b;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20);
    return r & 1 ? ~(r >> 1) : r >> 1;
  };
  while (i < str.length) { lat += dec(); lon += dec(); pts.push([lat / 1e5, lon / 1e5]); }
  return pts;
}

// ---------- opslag op dit apparaat ----------
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ---------- online spelstand (jsonblob.com) ----------
const BLOB = 'https://jsonblob.com/api/jsonBlob';
const isLocal = (id) => String(id).startsWith('lokaal-');
const Store = {
  async createLocal(data) {
    const id = 'lokaal-' + Math.random().toString(36).slice(2, 10);
    ls.set('fm_game_' + id, data);
    return id;
  },
  async create(data) {
    const res = await fetch(BLOB, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error('Online opslag gaf fout ' + res.status);
    const loc = res.headers.get('Location') || res.headers.get('x-jsonblob-id') || res.headers.get('X-jsonblob') || '';
    const id = loc.split('/').pop();
    if (!id) throw new Error('Online opslag gaf geen spel-id terug');
    return id;
  },
  async load(id) {
    if (isLocal(id)) { const d = ls.get('fm_game_' + id, null); if (!d) throw new Error('Dit lokale spel staat niet op dit apparaat'); return d; }
    const res = await fetch(`${BLOB}/${id}`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
    if (res.status === 404) throw new Error('Dit spel bestaat niet (meer) online');
    if (!res.ok) throw new Error('Online opslag gaf fout ' + res.status);
    return res.json();
  },
  async save(id, data) {
    if (isLocal(id)) { ls.set('fm_game_' + id, data); return; }
    const res = await fetch(`${BLOB}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
    if (!res.ok) throw new Error('Opslaan mislukt (' + res.status + ')' + (res.status === 413 ? ': spel te groot' : ''));
  },
};
const emptyGame = () => ({ app: 'fietsmonopoly', v: 1, created: new Date().toISOString(), players: [], rides: [] });

// Spelstand ophalen, aanpassen en terugschrijven (zo overschrijf je elkaars ritten niet)
async function mutate(fn) {
  const data = await Store.load(GAME_ID);
  fn(data);
  await Store.save(GAME_ID, data);
  return data;
}

async function newGame() {

// Ritgegevens van de online stand + eigen namen en routes van dit apparaat samenvoegen
function setState(data, fit) {
  const local = ls.get(localKey(), {});
  const rides = (data.rides || []).map((r) => {
    const ways = (r.ways || []).map((w) => ({ ...w, g: typeof w.g === 'string' ? decodePolyline(w.g) : w.g }));
    const mine = r.playerId === ME.id;
    const loc = mine ? local[r.rideId] || {} : {};
    return { ...r, ways, name: mine ? loc.name || 'Rit' : null, track: mine && loc.track ? decodePolyline(loc.track) : [] };
  });
  STATE = { players: data.players || [], rides };
  GAME = replay(STATE.players, STATE.rides);
  render(fit);
}

async function refresh(fit = false) {
  const data = await Store.load(GAME_ID);
  setState(data, fit);
  return data;
}

// ---------- spelbestand (reserve als online opslag niet werkt) ----------
async function downloadGame() {
  let data;
  try { data = await Store.load(GAME_ID); } catch (e) { return toast(e.message); }
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fietsmonopoly-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}

function mergeGames(a, b) {
  const out = { ...emptyGame(), ...a, players: [...(a.players || [])], rides: [...(a.rides || [])] };
  for (const p of b.players || []) if (!out.players.some((x) => x.id === p.id)) out.players.push(p);
  for (const r of b.rides || []) if (!out.rides.some((x) => x.playerId === r.playerId && x.rideId === r.rideId)) out.rides.push(r);
  return out;
}

async function loadGameFile(file) {
  try {
    const incoming = JSON.parse(await file.text());
    if (incoming.app !== 'fietsmonopoly') throw new Error('Dit is geen Fietsmonopoly-spelbestand');
    busy('Spelbestand laden…');
    if (GAME_ID) {
      await mutate((d) => { const m = mergeGames(d, incoming); d.players = m.players; d.rides = m.rides; });
      busy(null);
      await openGame();
    } else {
      try { GAME_ID = await Store.create(incoming); } catch { GAME_ID = await Store.createLocal(incoming); }
      history.replaceState(null, '', '#spel-' + GAME_ID);
      busy(null);
      await openGame();
    }
    toast('Spelbestand samengevoegd');
  } catch (e) { busy(null); toast('Laden mislukt: ' + e.message, 7000); }
}

// Achtergrondkaarten zonder API-sleutel. Lukt de ene niet, dan schakelt de app door naar de volgende.
const BASEMAPS = [
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt: { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers' } },
  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', opt: { maxZoom: 19, attribution: 'Kaart &copy; Esri, HERE, Garmin, &copy; OpenStreetMap-bijdragers' } },
  { url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', opt: { maxZoom: 17, subdomains: 'abc', attribution: '&copy; OpenStreetMap-bijdragers, &copy; OpenTopoMap (CC-BY-SA)' } },
];
let baseLayer = null;
function addBaseLayer(i) {
  if (baseLayer) map.removeLayer(baseLayer);
  const b = BASEMAPS[i % BASEMAPS.length];
  let errors = 0, loaded = 0;
  baseLayer = L.tileLayer(b.url, b.opt).addTo(map);
  baseLayer.on('tileload', () => loaded++);
  baseLayer.on('tileerror', () => {
    errors++;
    if (errors >= 4 && loaded === 0 && i + 1 < BASEMAPS.length * 1) addBaseLayer(i + 1);
  });
  baseLayer.bringToBack();
}

// ---------- ritten verwerken ----------
function busy(text, sub = '') {
  $('#busy').hidden = !text;
  if (text) { $('#busyText').textContent = text; $('#busySub').textContent = sub; }
}
function toast(msg, ms = 3500) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.hidden = true), ms);
}

async function hash(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].slice(0, 6).map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function uploadGPX(files) {
  const newKeys = [];
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const label = `Rit ${i + 1} van ${files.length}: ${f.name}`;
      busy(label, 'Bestand lezen…');
      const { latlngs, date, name } = parseGPX(await f.text(), f.name);
      const rideId = 'r' + (await hash(date + '|' + latlngs.length + '|' + latlngs[0].join(',')));
      if (STATE.rides.some((r) => r.playerId === ME.id && r.rideId === rideId)) { toast(`"${name}" stond er al in`); continue; }
      const queries = buildOverpassQueries(latlngs);
      const elements = await fetchOverpass(queries, (qi, n) => busy(label, `Kaart ophalen${n > 1 ? ` (deel ${qi + 1} van ${n})` : ''}…`));
      busy(label, 'Straten, paden en bruggen zoeken…');
      await new Promise((r) => setTimeout(r, 30));
      const m = matchRide(latlngs, elements);
      // naam en route alleen op dit apparaat bewaren
      const local = ls.get(localKey(), {});
      local[rideId] = { name, track: encodePolyline(m.track) };
      ls.set(localKey(), local);
      const ride = {
        playerId: ME.id, rideId, date, distanceKm: m.distanceKm, loop: m.loop,
        ways: m.ways.map((w) => ({ ...w, g: encodePolyline(w.g) })),
      };
      busy(label, 'Opslaan in het spel…');
      await mutate((d) => { if (!d.rides.some((r) => r.playerId === ME.id && r.rideId === rideId)) d.rides.push(ride); });
      newKeys.push(ME.id + ':' + rideId);
    }
    busy('Bank telt het geld…');
    await refresh(true);
    busy(null);
    if (newKeys.length) showReport(newKeys);
  } catch (e) {
    busy(null);
    toast('Rit verwerken mislukt: ' + e.message, 8000);
  }
}

async function deleteRide(rideId) {
  await mutate((d) => { d.rides = d.rides.filter((r) => !(r.playerId === ME.id && r.rideId === rideId)); });
  const local = ls.get(localKey(), {}); delete local[rideId]; ls.set(localKey(), local);
  await refresh(false);
}

function render(fit) {

const PLURAL = { straat: 'Straten', fietspad: 'Fietspaden', pad: 'Paden', brug: 'Bruggen', tunnel: 'Tunnels', rotonde: 'Rotondes', pont: 'Ponten' };
const player = (id) => GAME.players.get(id);
const pname = (id) => (id === ME.id ? 'jou' : player(id)?.name || 'iemand');

function renderPlayers() {
  const list = [...GAME.players.values()].sort((a, b) => b.worth - a.worth);
  $('#players').innerHTML = list.map((p) => `
    <div class="pcard" style="border-left-color:${esc(p.color)}">
      <div class="nm"><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}${p.id === ME.id ? ' (jij)' : ''}</div>
      <div class="bal ${p.balance < 0 ? 'neg' : ''}">${fmtMoney(p.balance)}</div>
      <div class="sub">${p.propCount} bezittingen · vermogen ${fmtMoney(p.worth)}</div>
    </div>`).join('');
}

function propCenter(pr) {
  // middelste punt van de langste weg
  let best = null;
  for (const w of pr.ways.values()) if (!best || w.len > best.len) best = w;
  return best.g[Math.floor(best.g.length / 2)];
}

function renderMap(fit) {
  propLayer.clearLayers(); houseLayer.clearLayers(); propLines.clear();
  const onlyMine = $('#onlyMine').checked;
  const bounds = [];
  for (const pr of GAME.props.values()) {
    if (!pr.owner) continue;
    if (onlyMine && pr.owner !== ME.id) continue;
    const pl = player(pr.owner);
    const color = pl?.color || '#888';
    const lines = [];
    for (const w of pr.ways.values()) {
      const weight = pr.kind === 'straat' ? 6 : pr.kind === 'pont' ? 4 : 5;
      const casing = L.polyline(w.g, { color: '#111', weight: weight + 3, opacity: 0.75, interactive: false });
      const line = L.polyline(w.g, { color, weight, opacity: 0.95, dashArray: pr.kind === 'pont' ? '8 8' : pr.kind === 'pad' ? '2 7' : null, lineCap: pr.kind === 'pad' ? 'round' : 'butt' });
      line.bindPopup(() => deedHTML(pr, true), { maxWidth: 220 });
      line.on('mouseover', () => line.setStyle({ weight: weight + 3 }));
      line.on('mouseout', () => line.setStyle({ weight }));
      propLayer.addLayer(casing); propLayer.addLayer(line);
      lines.push(line);
      if (pr.owner === ME.id || !onlyMine) bounds.push(...w.g);
    }
    propLines.set(pr.key, lines);
    if (pr.houses > 0) {
      const html = pr.houses === 5 ? '<i class="hotel"></i>' : '<i></i>'.repeat(pr.houses);
      houseLayer.addLayer(L.marker(propCenter(pr), { icon: L.divIcon({ className: 'house-marker', html, iconSize: null }), interactive: false }));
    }
  }
  if (map.getZoom() < 13) map.removeLayer(houseLayer);
  if (fit && bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
}

function renderLegend() {
  const ps = GAME ? [...GAME.players.values()] : [];
  $('#legend').innerHTML =
    ps.map((p) => `<div><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.name)}${p.id === ME.id ? ' (jij)' : ''}</div>`).join('') +
    `<div class="small">─── straat/fietspad · ··· pad · - - pont</div>` +
    `<div class="small"><span class="houses"><i></i></span> huis <span class="houses"><i class="hotel"></i></span> hotel</div>`;
}

function deedHTML(pr, inPopup = false) {
  const K = KINDS[pr.kind];
  const light = ['brug'].includes(pr.kind);
  const owner = pr.owner ? player(pr.owner) : null;
  const price = pr.price ?? priceOf(pr.kind, pr.len);
  let rows;
  if (pr.kind === 'pont') {
    rows = [1, 2, 3, 4].map((n) => `<tr><td>${n} pont${n > 1 ? 'en' : ''} in bezit</td><td>${fmtMoney(PONT_RENT[n])}</td></tr>`).join('');
  } else {
    const rt = rentTable({ price });
    const lbl = ['Huur', 'Met 1 huis', 'Met 2 huizen', 'Met 3 huizen', 'Met 4 huizen', 'Met hotel'];
    rows = rt.map((v, i) => `<tr class="${pr.owner && pr.houses === i ? 'cur' : ''}"><td>${lbl[i]}</td><td>${fmtMoney(v)}</td></tr>`).join('');
  }
  const houses = pr.houses ? `<span class="houses">${pr.houses === 5 ? '<i class="hotel"></i>' : '<i></i>'.repeat(pr.houses)}</span>` : '';
  return `<div class="deed" data-key="${esc(pr.key)}">
    <div class="band ${light ? 'light' : ''}" style="background:${K.color}">
      <div class="kind">Eigendomsbewijs · ${K.label}</div>
      <div class="title">${esc(pr.name)}</div>
    </div>
    <table>${rows}</table>
    <div class="foot">
      ${pr.kind !== 'pont' ? `Huis kost ${fmtMoney(houseCostOf(price))} · ` : ''}${Math.round(pr.len)} m<br>
      ${owner ? `<span class="dot" style="background:${esc(owner.color)};width:10px;height:10px"></span> ${esc(owner.id === ME.id ? 'Van jou' : 'Van ' + owner.name)} ${houses}` : `Te koop: ${fmtMoney(price)}`}
      ${pr.rentEarned ? `<br>Huur geïnd: ${fmtMoney(pr.rentEarned)}` : ''}
    </div>
  </div>`;
}

function bindDeedClicks(root) {
  root.querySelectorAll('.deed[data-key]').forEach((el) => (el.onclick = () => focusProp(el.dataset.key)));
}

function focusProp(key) {
  const pr = GAME.props.get(key);
  if (!pr) return;
  closeModal();
  const pts = [...pr.ways.values()].flatMap((w) => w.g);
  map.fitBounds(pts, { padding: [60, 60], maxZoom: 17 });
  const lines = propLines.get(key);
  if (lines && lines[0]) setTimeout(() => lines[0].openPopup(propCenter(pr)), 400);
  if (window.innerWidth < 860) $('#map').scrollIntoView({ behavior: 'smooth' });
}

function renderHoldings() {
  const mine = [...GAME.props.values()].filter((p) => p.owner === ME.id);
  const el = $('#panel-bezit');
  if (!mine.length) {
    el.innerHTML = `<div class="empty">Je hebt nog niets in bezit.<br>Fiets een rondje en klik op <b>Rit toevoegen (GPX)</b>.</div>`;
    return;
  }
  const order = Object.keys(KINDS);
  mine.sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind) || (b.price + b.houses * 100) - (a.price + a.houses * 100));
  let html = '';
  for (const k of order) {
    const group = mine.filter((p) => p.kind === k);
    if (!group.length) continue;
    html += `<h3>${PLURAL[k]} (${group.length})</h3>`;
    html += `<div class="deeds">${group.map((p) => deedHTML(p)).join('')}</div>`;
  }
  el.innerHTML = html;
  bindDeedClicks(el);
}

function eventsList(rep, { detail }) {
  const items = [];
  const nm = (key) => esc(GAME.props.get(key)?.name || '?');
  const isMe = rep.playerId === ME.id;
  for (const e of rep.events) {
    if (e.t === 'buy') items.push(`kocht <b>${nm(e.key)}</b> voor ${fmtMoney(e.amount)}`);
    else if (e.t === 'house') items.push(`bouwde een huis op <b>${nm(e.key)}</b> (${e.houses})`);
    else if (e.t === 'hotel') items.push(`bouwde een <b>hotel</b> op <b>${nm(e.key)}</b>`);
    else if (e.t === 'rent') items.push(`betaalde <span class="min">${fmtMoney(e.amount)}</span> huur aan ${esc(pname(e.to))} voor <b>${nm(e.key)}</b>`);
    else if (e.t === 'start' && detail) items.push(`kwam langs Start: <span class="plus">+${fmtMoney(e.amount)}</span>`);
    else if (e.t === 'km' && detail && isMe) items.push(`fietste ${e.amount} km: <span class="plus">+${fmtMoney(e.amount)}</span>`);
    else if (e.t === 'tooExpensive' && detail && isMe) items.push(`kon <b>${nm(e.key)}</b> niet betalen (${fmtMoney(e.amount)})`);
  }
  return items;
}

function renderFeed() {
  const el = $('#panel-feed');
  if (!GAME.reports.length) { el.innerHTML = '<div class="empty">Nog geen ritten gespeeld.</div>'; return; }
  el.innerHTML = GAME.reports.slice(0, 80).map((rep) => {
    const p = player(rep.playerId);
    const isMe = rep.playerId === ME.id;
    const items = eventsList(rep, { detail: false });
    const title = isMe ? esc(rep.name || 'Rit') : `Rit van ${esc(p?.name || '?')}`;
    const received = isMe ? [] : rep.events.filter((e) => e.t === 'rent' && e.to === ME.id);
    return `<div class="ev">
      <div class="hd"><span class="dot" style="background:${esc(p?.color || '#888')}"></span>${title}<span class="when">${fmtDate(rep.date)}</span></div>
      ${received.length ? `<div class="plus">Jij ontving ${fmtMoney(received.reduce((s, e) => s + e.amount, 0))} huur!</div>` : ''}
      ${items.length ? `<ul>${items.map((i) => `<li>${isMe ? 'Je ' : esc(p?.name || '') + ' '}${i}</li>`).join('')}</ul>` : '<div class="small">Niets bijzonders gebeurd.</div>'}
      ${isMe ? `<div class="tools"><button class="linkbtn" data-report="${esc(rep.key)}">Ritverslag bekijken</button></div>` : ''}
    </div>`;
  }).join('');
  el.querySelectorAll('[data-report]').forEach((b) => (b.onclick = () => showReport([b.dataset.report])));
}

function renderMyRides() {
  const el = $('#panel-ritten');
  const mine = GAME.reports.filter((r) => r.playerId === ME.id);
  if (!mine.length) { el.innerHTML = '<div class="empty">Nog geen ritten verwerkt.</div>'; return; }
  el.innerHTML = `<p class="small">Ritnamen en routes staan alleen op dit apparaat. Je maat ziet alleen wat je bezit.</p>` + mine.map((r) => `
    <div class="ev">
      <div class="hd">${esc(r.name)}<span class="when">${fmtDate(r.date)} · ${(r.distanceKm || 0).toLocaleString('nl-NL')} km</span></div>
      <div class="tools">
        <button class="linkbtn" data-show="${esc(r.rideId)}">Toon route</button>
        <button class="linkbtn" data-report="${esc(r.key)}">Ritverslag</button>
        <button class="btn btn-danger" data-del="${esc(r.rideId)}">Verwijder</button>
      </div>
    </div>`).join('');
  el.querySelectorAll('[data-show]').forEach((b) => (b.onclick = () => showTrack(b.dataset.show)));
  el.querySelectorAll('[data-report]').forEach((b) => (b.onclick = () => showReport([b.dataset.report])));
  el.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Zeker weten?'; setTimeout(() => { b.dataset.confirm = ''; b.textContent = 'Verwijder'; }, 4000); return; }
    busy('Rit verwijderen…');
    try { await deleteRide(b.dataset.del); toast('Rit verwijderd. Het spel is opnieuw doorgerekend.'); }
    catch (e) { toast(e.message); }
    busy(null);
  }));
}

function showTrack(rideId) {
  trackLayer.clearLayers();
  const r = STATE.rides.find((x) => x.playerId === ME.id && String(x.rideId) === String(rideId));
  if (!r || !r.track?.length) return toast('Geen route bewaard voor deze rit.');
  const l = L.polyline(r.track, { color: '#111', weight: 3, dashArray: '6 6', opacity: 0.8 }).addTo(trackLayer);
  map.fitBounds(l.getBounds(), { padding: [30, 30] });
  toast('Route getoond als stippellijn. Klik nog eens op een andere rit om te wisselen.');
}

// ---------- ritverslag ----------
function showReport(keys) {
  const reps = keys.map((k) => GAME.reports.find((r) => r.key === k)).filter(Boolean).reverse();
  if (!reps.length) return;
  const sum = (t) => reps.flatMap((r) => r.events).filter((e) => e.t === t);
  const km = sum('km').reduce((s, e) => s + e.amount, 0);
  const start = sum('start').reduce((s, e) => s + e.amount, 0);
  const bought = sum('buy');
  const built = [...sum('house'), ...sum('hotel')];
  const rent = sum('rent');
  const tooExp = sum('tooExpensive');
  const rentTotal = rent.reduce((s, e) => s + e.amount, 0);
  const me = player(ME.id);
  const title = reps.length === 1 ? reps[0].name : `${reps.length} nieuwe ritten`;

  const nm = (key) => esc(GAME.props.get(key)?.name || '?');
  $('#modalBody').innerHTML = `<div class="report">
    <div class="small">Ritverslag</div>
    <h2>${esc(title)}</h2>
    <div class="chips">
      <span class="chip go">+${fmtMoney(km)} voor ${km} km</span>
      ${start ? `<span class="chip go">Langs Start +${fmtMoney(start)}</span>` : ''}
      <span class="chip">${bought.length} gekocht</span>
      ${built.length ? `<span class="chip">${built.length} × gebouwd</span>` : ''}
      ${rentTotal ? `<span class="chip bad">−${fmtMoney(rentTotal)} huur betaald</span>` : ''}
      <span class="chip">Saldo nu ${fmtMoney(me.balance)}</span>
    </div>
    ${bought.length ? `<h3 style="font-family:'Bebas Neue';font-size:24px;margin:10px 0 6px">Nieuw in bezit</h3>
      <div class="deeds reveal">${bought.map((e, i) => deedHTML(GAME.props.get(e.key)).replace('class="deed"', `class="deed" style="animation-delay:${Math.min(i, 20) * 0.08}s"`)).join('')}</div>`
      : '<p>Deze rit leverde geen nieuwe bezittingen op. Probeer eens een weg die je nog nooit hebt gefietst!</p>'}
    ${built.length ? `<h3 style="font-family:'Bebas Neue';font-size:24px;margin:16px 0 6px">Gebouwd</h3><ul>${built.map((e) => `<li>${e.t === 'hotel' ? 'Hotel' : 'Huis ' + e.houses} op <b>${nm(e.key)}</b> (${fmtMoney(e.amount)})</li>`).join('')}</ul>` : ''}
    ${rent.length ? `<h3 style="font-family:'Bebas Neue';font-size:24px;margin:16px 0 6px">Huur betaald</h3><ul>${rent.map((e) => `<li>${fmtMoney(e.amount)} aan ${esc(pname(e.to))} voor <b>${nm(e.key)}</b></li>`).join('')}</ul>` : ''}
    ${tooExp.length ? `<details style="margin-top:12px"><summary>${tooExp.length} keer gereden maar te weinig geld</summary><ul>${tooExp.map((e) => `<li>${nm(e.key)} (${fmtMoney(e.amount)})</li>`).join('')}</ul></details>` : ''}
  </div>`;
  $('#modal').hidden = false;
  bindDeedClicks($('#modalBody'));
}
function closeModal() { $('#modal').hidden = true; }

function renderRules() {
  $('#panel-regels').innerHTML = `<div class="rules">
    <h3>Zo werkt het (testversie)</h3>
    <ul>
      <li>Iedereen begint met <b>${fmtMoney(START_MONEY)}</b>.</li>
      <li>Elke gefietste kilometer levert <b>ƒ1</b> op. Begint en eindigt je rit op dezelfde plek (binnen 500 m), dan kom je <b>langs Start: +${fmtMoney(START_BONUS)}</b> (één keer per dag).</li>
      <li>Fiets je een stuk weg dat nog van niemand is, dan koop je het automatisch als je genoeg geld hebt. Een straat telt als gereden als je er minstens 60 meter (of de helft) van hebt afgelegd. Alleen even oversteken telt niet.</li>
      <li>Wegen met dezelfde naam vlak bij elkaar vormen één bezit. Fietspaden langs een weg krijgen de naam van die weg ("Fietspad langs …").</li>
      <li>Fiets je over je eigen bezit, dan bouw je er automatisch een <b>huis</b> op (max. 4, de 5e wordt een <b>hotel</b>), als je genoeg geld hebt.</li>
      <li>Fiets je over het bezit van een ander, dan betaal je <b>huur</b>. Hoe meer huizen, hoe hoger de huur (×${RENT_MULT.join(' / ×')}).</li>
      <li><b>Ponten</b> zijn de stations: de huur hangt af van hoeveel ponten de eigenaar heeft (${PONT_RENT.slice(1).map(fmtMoney).join(', ')}).</li>
      <li>Alles wordt op volgorde van rijdatum opnieuw doorgerekend. Upload je een oudere rit, dan kan de stand dus veranderen.</li>
    </ul>
    <h3>Prijzen</h3>
    <ul>${Object.values(KINDS).map((K) => `<li><b>${K.label}</b>: ${K.perM ? `${fmtMoney(K.base)} + lengte, max ${fmtMoney(K.cap)}` : fmtMoney(K.base)}</li>`).join('')}</ul>
    <p class="small">Kaartgegevens © OpenStreetMap-bijdragers (via Overpass). Spelstand opgeslagen bij jsonblob.com.</p>
  </div>`;
}

</script>
